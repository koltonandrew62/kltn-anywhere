<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>KLTN Anywhere</title>
<meta name="description" content="KLTN Research Terminal on your phone: live markets, quotes, charts, news and every terminal function.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#282828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KLTN">
<link rel="icon" href="icons/icon-192.png" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/anywhere.css">
</head>
<body>
<div id="app">
  <header class="nb" id="nb">
    <div class="nb-l" id="nbl"></div>
    <div class="nb-t" id="nbt">Home</div>
    <div class="nb-r" id="nbr"></div>
  </header>
  <main id="mv" class="mv"></main>
  <nav class="tb" id="tb">
    <button data-v="home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.2 7.5v9M9.2 12.2l5.2-4.7M11.4 10.3l3.4 6.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Home</span></button>
    <button data-v="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m15.2 15.2 5.3 5.3" stroke="currentColor" stroke-width="1.7"/></svg><span>Search</span></button>
    <button data-v="monitor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h17M3.5 10.2h17M3.5 14.9h17M3.5 19.6h17M8.7 5.5v14.1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Monitor</span></button>
    <button data-v="news"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h12.5v15H6a2 2 0 0 1-2-2zM16.5 8.5H20v9a2 2 0 0 1-2 2h-1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 8.5h6.5M7 11.7h6.5M7 14.9h4.5" stroke="currentColor" stroke-width="1.5"/></svg><span>News</span></button>
    <button data-v="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="1.7"/></svg><span>Menu</span></button>
  </nav>
</div>
<script>window.KLTN_STATIC = 1;</script>
<script src="js/anywhere.js"></script>
</body>
</html>
